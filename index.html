<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INUCASTY Elections 2026</title>
    <style>
        :root {
            --primary: #0066cc;
            --secondary: #ff9900;
            --bg: #f4f7f6;
            --dark: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--dark);
        }

        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .balance-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef6ff;
            border-left: 5px solid var(--primary);
            padding: 1rem;
            border-radius: 8px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0052a3;
        }

        .btn-pay {
            background-color: var(--secondary);
            font-weight: bold;
        }

        .btn-pay:hover {
            background-color: #e68a00;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .candidate-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .candidate-card h3 {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Plateforme de Vote INUCASTY 2026</h1>
        <p>Élections du Bureau des Étudiants</p>
    </header>

    <div class="container">
        <!-- Dashboard Solde -->
        <div class="card balance-box">
            <div>
                <h3>Vos Crédits de Vote</h3>
                <p id="creditBalance" style="font-size: 1.5rem; font-weight: bold; margin: 0; color: var(--primary);">0 FCFA</p>
            </div>
            <button class="btn btn-pay" onclick="document.getElementById('rechargeForm').scrollIntoView();">Recharger</button>
        </div>

        <!-- Formulaire de Recharge via Notch Pay -->
        <div class="card" id="rechargeForm">
            <h2>Acheter des Crédits de Vote (Mobile Money)</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label for="amount">Montant à recharger (FCFA)</label>
                    <input type="number" id="amount" placeholder="Ex: 500" min="100" required>
                </div>
                <div class="form-group">
                    <label for="phone">Numéro Mobile Money (MTN / Orange)</label>
                    <input type="tel" id="phone" placeholder="Ex: 6XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" placeholder="etudiant@inucasty.cm" required>
                </div>
                <button type="submit" class="btn btn-pay" style="width: 100%;">Payer avec Notch Pay</button>
            </form>
        </div>

        <!-- Section de Vote -->
        <div class="card">
            <h2>Votez pour votre Candidat</h2>
            <div class="candidates-grid">
                <div class="candidate-card">
                    <h3>Candidat A</h3>
                    <p>Filière: Génie Logiciel</p>
                    <button class="btn" onclick="vote('Candidat A', 100)">Voter (100 FCFA)</button>
                </div>
                <div class="candidate-card">
                    <h3>Candidat B</h3>
                    <p>Filière: Réseaux & Télécoms</p>
                    <button class="btn" onclick="vote('Candidat B', 100)">Voter (100 FCFA)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Clé Publique de Test Notch Pay
        const NOTCHPAY_PUBLIC_KEY = 'pk_test.ntI1FLEUnHhEJaaCxSP9v6V7OPq5Ea71OCH4ZHtwf9JneYO0gU0YbR01gNaQTH1CFxUZMHAxdTxleVStZBE7waQg9pBUM3k5CqFVL7H51W3IbWEHUiviCZ4UWQ0Bq';

        let userCredits = parseInt(localStorage.getItem('inucasty_credits')) || 0;
        updateBalanceUI();

        function updateBalanceUI() {
            document.getElementById('creditBalance').innerText = `${userCredits} FCFA`;
        }

        // Gestion du formulaire de paiement
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const amount = document.getElementById('amount').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;

            await initiateNotchPay(amount, phone, email);
        });

        // Fonction d'initiation du paiement Notch Pay
        async function initiateNotchPay(amount, userPhone, userEmail) {
            try {
                const response = await fetch('https://api.notchpay.co/payments', {
                    method: 'POST',
                    headers: {
                        'Authorization': NOTCHPAY_PUBLIC_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        currency: 'XAF',
                        customer: {
                            phone: userPhone,
                            email: userEmail
                        },
                        description: `Achat de crédits de vote INUCASTY (${amount} FCFA)`,
                        reference: `INU_TEST_${Date.now()}`,
                        callback: window.location.href
                    })
                });

                const data = await response.json();

                if (data.authorization_url) {
                    // Simulation locale pour le mode de test client
                    localStorage.setItem('pending_recharge', amount);
                    
                    // Redirection vers le guichet sécurisé Notch Pay
                    window.location.href = data.authorization_url;
                } else {
                    alert("Erreur lors de l'initialisation du paiement : " + (data.message || "Vérifiez vos informations"));
                }
            } catch (error) {
                console.error("Erreur paiement Notch Pay:", error);
                alert("Impossible de contacter le serveur de paiement.");
            }
        }

        // Vérification de retour après paiement
        window.addEventListener('DOMContentLoaded', () => {
            const pendingAmount = localStorage.getItem('pending_recharge');
            const urlParams = new URLSearchParams(window.location.search);
            
            // Si l'utilisateur revient de la page de paiement avec un statut de succès
            if (pendingAmount && (urlParams.get('status') === 'complete' || urlParams.get('reference'))) {
                userCredits += parseInt(pendingAmount);
                localStorage.setItem('inucasty_credits', userCredits);
                localStorage.removeItem('pending_recharge');
                updateBalanceUI();
                alert(`Paiement réussi ! Votre compte a été crédité de ${pendingAmount} FCFA.`);
            }
        });

        // Fonction de Vote
        function vote(candidateName, cost) {
            if (userCredits < cost) {
                alert("Solde insuffisant ! Veuillez recharger votre compte.");
                document.getElementById('rechargeForm').scrollIntoView();
                return;
            }

            userCredits -= cost;
            localStorage.setItem('inucasty_credits', userCredits);
            updateBalanceUI();
            alert(`Votre vote pour ${candidateName} a été pris en compte ! Solde restant : ${userCredits} FCFA.`);
        }
    </script>
</body>
</html>
